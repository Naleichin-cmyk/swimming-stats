вую явку старшего трека 100–130 человек (не до 160) — при полной верхней явке 'до 3 стартов' физически недостижимо для большинства."},{n:3,text:"Утвердить бюджет стартов в единицах для старшего трека: 50/100/200 м = 1 ед., 400 м = 2 ед., лимит 3 ед./чел.; в юниорском треке — прямой выбор 1–3 дистанций без весов."},{n:4,text:"Утвердить двойную судейскую модель (официальный зачёт + незачётные учебные заплывы для новичков) и согласовать её статус с Федерацией."},{n:5,text:"Подтвердить у Федерации, что возрастной диапазон 7–16 лет (группа 15–16 лет добавляет год к исходным 7–15) не требует иного регламентного статуса."},{n:6,text:"Утвердить зачёт «лучшие 3 из 4» этапов внутри каждого трека для сезонного рейтинга."},{n:7,text:"Утвердить разовый стартовый взнос ≈600 лей/этап без обязательного сезонного пакета — при новой модели полная сумма трека за сезон 2 400 лей (4 этапа), а не 4 800."},{n:8,text:"Утвердить основной вариант награждения — медали 1–3 место на этапе + расширенное награждение в финале своего трека."},{n:9,text:"Согласовать точные месяцы летнего перерыва и календарь Федерации на сезон 2026/27 во избежание накладок."},{n:10,text:"Направить регламент на юридическую проверку (протесты, персональные данные, ответственность организаторов, медицинский допуск)."},{n:11,text:"Подтвердить реальные ставки персонала, себестоимость бассейна и бюджет наград/пакетов у бухгалтерии AquaTerra."}],uP=["Утвердить решения 1–10 выше на встрече с руководством AquaTerra — до конца августа.","Направить регламент на согласование в Федерацию — первая неделя сентября.","Разослать положение клубам на рум./рус. — за 30 дней до этапа 1 (конец августа/начало сентября).","Открыть приём заявок через Entry Editor — за 21 день.","Собрать и проинструктировать судейскую бригаду этапа 1 — за 14 дней.","Заказать медали, грамоты и стартовые пакеты под выбранный тариф — за 14 дней.","Закрыть заявки, импортировать в Meet Manager, проверить заявочные времена — за 7 дней.","Опубликовать стартовый про  фото/видео) — требует юридической проверки на соответствие законодательству Молдовы о защите персональных данных.",legal:!0},{title:"Фото и видеосъёмка",text:"Публикация фото/видео с этапов в маркетинговых материалах — согласие оформляется одновременно с заявкой на участие.",legal:!0}];var g=(p("7MwD8"),p("7MwD8"),p("7MwD8"));function tS(e,[t,n]){return Math.min(n,Math.max(t,e))}(0,Object.defineProperty)(tS,"name",{value:"clamp",configurable:!0});var tE=Object.defineProperty,tC=(e,t)=>tE(e,"name",{value:t,configurable:!0}),tN=!!("u">typeof window&&window.document&&window.document.createElement);function tj(e,t,{checkForDefaultPrevented:n=!0}={}){return tC(function(r){if(e?.(r),!1===n||!r||!r.defaultPrevented)return t?.(r)},"handleEvent")}function tP(e){if(!tN)throw Error("Cannot access document outside of the DOM");return e?.ownerDocument??document}function tT(e){return"IFRAME"===e.tagName}tC(tj,"composeEventHandlers"),tC(function(e){if(!tN)throw Error("Cannot access window outside of the DOM");return e?.ownerDocument?.defaultView??window},"getOwnerWindow"),tC(tP,"getOwnerDocument"),tC(function e(t,n=!1){let{activeElement:r}=tP(t);if(!r?.nodeName)return null;if(tT(r)&&r.contentDocument)return e(r.contentDocument.body,n);if(n){let e=r.getAttribute("aria-activedescendant");if(e){let t=tP(r).getElementById(e);if(t)return t}}return r},"getActiveElement"),tC(tT,"isFrame");var g=p("7MwD8"),t_=Object.defineProperty,tR=(e,t)=>t_(e,"name",{value:t,configurable:!0});function tz(e,t){if("function"==typeof e)return e(t);null!=e&&(e.current=t)}function tM(...e){return t=>{let n=!1,r=e.map(e=>{let r=tz(e,t);return n||"function"!=typeof r||(n=!0),r});if(n)return()=>{for(let t=0;t<r.length;t++){let n=r[t];"function"==typeof n?n():tz(e[t],null)}}}}function tO(...e){return g.useCallback(tM(...e),e)}tR(tz,"setRef"),tR(tM,"composeRefs"),tR(tO,"useComposedRefs");var g=p("7MwD8"),tL=Object.defineProperty,tD=(e,t)=>tL(e,"name",{value:t,configurable:!0});function tA(e,t=[]){let n=[];funct
